name: Release native desktop packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            rid: osx-arm64
          - name: macOS Intel
            os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches product version
        shell: pwsh
        run: |
          $props = Get-Content ./Directory.Build.props -Raw
          $match = [regex]::Match($props, '<Version>([^<]+)</Version>')
          if (-not $match.Success) { throw 'Product version was not found.' }
          $expected = 'v' + $match.Groups[1].Value
          if ($expected -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match $expected."
          }

      - name: Build and validate solution
        shell: pwsh
        run: |
          dotnet restore ./ChoirLauncher.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ./ChoirLauncher.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create self-contained native package
        shell: pwsh
        run: ./Tools/Build-DesktopPackage.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Force

      - name: Create Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildInfo = Get-Content ./Source/ChoirLauncher.Core/BuildInfo.cs -Raw
          $version = [regex]::Match($buildInfo, 'Version\s*=\s*"([^"]+)"').Groups[1].Value
          $buildId = [regex]::Match($buildInfo, 'BuildId\s*=\s*"([^"]+)"').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version) -or [string]::IsNullOrWhiteSpace($buildId)) {
            throw 'Could not read the setup payload identity.'
          }
          $payload = (Resolve-Path "./Release/$version/ChoirLauncher-Desktop-win-x64-self-contained.zip").Path
          $payloadSha = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupOutput = "./Release/$version/setup"
          dotnet publish ./Source/ChoirLauncher.Installer/ChoirLauncher.Installer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            "-p:PayloadZip=$payload" "-p:PayloadSha256=$payloadSha" `
            "-p:PayloadVersion=$version" "-p:PayloadBuildId=$buildId" `
            -o $setupOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Join-Path $setupOutput 'ChoirLauncher-Setup.exe'
          $verification = Start-Process -FilePath $setup -ArgumentList '--verify' -Wait -PassThru
          if ($verification.ExitCode -ne 0) { exit $verification.ExitCode }
          Copy-Item -LiteralPath $setup -Destination "./Release/$version/ChoirLauncher-Setup-win-x64.exe"

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: ChoirLauncher-${{ matrix.rid }}
          path: Release/*/ChoirLauncher-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v6

      - name: Download native packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create native package checksums
        shell: bash
        run: |
          mkdir release-assets
          find dist -type f -name 'ChoirLauncher-*' -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum ChoirLauncher-* > SHA256SUMS-NATIVE.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ChoirLauncher 0.3 RC6 fixes dependency-aware ordering for profiles whose stored identifiers predate canonical SyxForge manifests. The Fix Load Order workflow now applies recommendations through stable profile entries, so SyxForge providers reliably load before their consumers.

          RC6 also distinguishes actionable compatibility issues from informational notes, suppresses standalone warnings for expected SyxForge platform ownership while preserving real multi-owner collisions, improves the compatibility and load-order interface, and restores Quire Launcher as the primary desktop identity.

          Windows users should normally download the setup EXE. Linux users need the `linux-x64` archive. Apple Silicon Mac users need `osx-arm64`; Intel Mac users need `osx-x64`.

          See the [complete installation guide](https://github.com/Hvizeu/ChoirLauncher/blob/main/docs/INSTALLATION.md) before installing. Linux and macOS packages are built on native GitHub runners but have not yet received owner runtime testing on physical Linux/macOS systems. Windows setup is unsigned and macOS packages are not notarized, so verify the published SHA-256 checksums.
          EOF

      - name: Create release with native packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "ChoirLauncher ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
